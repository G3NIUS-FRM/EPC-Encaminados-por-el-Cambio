<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="70%" stop-color="#FFC72C"/>
      <stop offset="100%" stop-color="#F5B700"/>
    </radialGradient>
  </defs>

  <!-- Outer dark navy circle -->
  <circle cx="32" cy="32" r="30" fill="#0A1A3D"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#000" stroke-width="1"/>

  <!-- Sun rays (simplified - 8 main rays) -->
  <g fill="#F5B700" stroke="#000" stroke-width="0.5">
    <polygon points="32,4 35,16 29,16"/>
    <polygon points="32,60 35,48 29,48"/>
    <polygon points="4,32 16,35 16,29"/>
    <polygon points="60,32 48,35 48,29"/>
    <polygon points="12,12 22,22 18,22 22,18"/>
    <polygon points="52,12 42,22 46,22 42,18"/>
    <polygon points="12,52 22,42 18,42 22,46"/>
    <polygon points="52,52 42,42 46,42 42,46"/>
  </g>

  <!-- Sun center -->
  <circle cx="32" cy="32" r="18" fill="url(#sunGradient)"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#000" stroke-width="1"/>

  <!-- Sun inner ring (navy) -->
  <circle cx="32" cy="32" r="15" fill="none" stroke="#1E3A8A" stroke-width="2"/>

  <!-- EPC text -->
  <text x="32" y="38"
        font-family="Montserrat, Arial Black, sans-serif"
        font-size="14"
        font-weight="900"
        fill="#0A1A3D"
        text-anchor="middle"
        stroke="#000"
        stroke-width="0.3">EPC</text>
</svg>